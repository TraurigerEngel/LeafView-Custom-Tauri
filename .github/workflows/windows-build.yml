name: Windows build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install JS dependencies
        run: npm ci
      - name: Run JavaScript checks
        run: npm test
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Portable EXE
        run: npm run tauri -- build --no-bundle
      - name: Upload Portable EXE as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeafView-Custom-Tauri-Windows-x64
          path: src-tauri/target/release/LeafView Custom Tauri.exe
          if-no-files-found: error
